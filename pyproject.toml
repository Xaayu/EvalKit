[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.1.0"
description = "ML model evaluation toolkit"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "pyyaml>=6.0",
]
[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
evalkit = "evalkit.cli:main"

[tool.setuptools.packages.find]
include = ["evalkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
